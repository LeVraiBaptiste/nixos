---
theme: dark

server:
  address: 'tcp://0.0.0.0:@authelia_port@'

log:
  level: info

totp:
  issuer: @domain@

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      salt_length: 16
      key_length: 32

access_control:
  default_policy: one_factor

session:
  cookies:
    - domain: @domain@
      authelia_url: https://auth.@domain@
      default_redirection_url: https://assistant.@domain@

storage:
  local:
    path: /data/db.sqlite3

notifier:
  smtp:
    address: 'submissions://smtp.gmail.com:465'
    username: '@smtp_username@'
    sender: '@smtp_sender@'
    disable_require_tls: false
