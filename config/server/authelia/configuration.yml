---
theme: dark

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

totp:
  issuer: example.com

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      salt_length: 16
      key_length: 32

access_control:
  default_policy: one_factor

session:
  cookies:
    - domain: example.com
      authelia_url: https://auth.example.com
      default_redirection_url: https://assistant.example.com

storage:
  local:
    path: /data/db.sqlite3

notifier:
  smtp:
    address: 'submissions://smtp.gmail.com:465'
    username: 'jane@example.com'
    sender: 'Auth <jane@example.com>'
    disable_require_tls: false
