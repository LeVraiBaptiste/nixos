services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    volumes:
      - /srv/hass/config:/config
    environment:
      TZ: @timezone@
    restart: unless-stopped

  caddy:
    image: caddy:2
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/caddy/data:/data
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    network_mode: host
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/media:/media
    environment:
      TZ: @timezone@
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    network_mode: host
    command: --port @filebrowser_port@
    volumes:
      - /srv/filebrowser/data:/srv
      - /srv/filebrowser/database:/database
      - /srv/filebrowser/config:/config
    environment:
      TZ: @timezone@
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml
      - /srv/authelia/data:/data
    network_mode: host
    environment:
      TZ: @timezone@
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "@authelia_jwt_secret@"
      AUTHELIA_SESSION_SECRET: "@authelia_session_secret@"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "@authelia_storage_encryption_key@"
      AUTHELIA_NOTIFIER_SMTP_PASSWORD: "@authelia_smtp_password@"
