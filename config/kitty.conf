# Theme
include current-theme.conf

# General
update_check_interval 0
enabled_layouts splits

# Keybindings: Move Kitty shortcuts to Alt+Shift (free Ctrl/Ctrl+Shift for tmux)
map alt+shift+left neighboring_window left
map alt+shift+right neighboring_window right
map alt+shift+up neighboring_window up
map alt+shift+down neighboring_window down
map alt+shift+n new_os_window
map alt+shift+s launch --location=vsplit --cwd=current
map alt+shift+w close_window
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+n no_op
map ctrl+shift+r no_op
map ctrl+shift+w send_text all exit\r
map ctrl+n no_op
map ctrl+r no_op

# Shift+Enter sends newline
map shift+enter send_text all \x0a
