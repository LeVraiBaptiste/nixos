gui:
  showIcons: true
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  border: rounded
  showDivergenceFromBaseBranch: arrowAndNumber # e.g. ↑2↓1 relative to main
  showBranchCommitHash: true
  expandFocusedSidePanel: true # the focused side panel grows
  theme:
    activeBorderColor:
      - white
      - bold
    inactiveBorderColor:
      - "#666666"
    lightTheme: false
git:
  # Cycle between renderers with `|`: unified first (readable in narrow
  # panels), side-by-side second.
  diffRenderers:
    - command: "delta --dark --paging=never --syntax-theme='Visual Studio Dark+'"
    - command: "delta --dark --paging=never --side-by-side --syntax-theme='Visual Studio Dark+'"
  diffContextSize: 99999
  autoFetch: true
  autoRefresh: true
  log:
    showGraph: always
os:
  editPreset: "nano"
promptToReturnFromSubprocess: false # no "press enter" after exiting nano
confirmOnQuit: false
