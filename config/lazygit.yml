gui:
  showIcons: true
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  theme:
    activeBorderColor:
      - white
      - bold
    inactiveBorderColor:
      - "#666666"
    lightTheme: false
git:
  pagers:
    - pager: "delta --dark --paging=never --side-by-side --syntax-theme='Visual Studio Dark+'"
  diffContextSize: 99999
  autoFetch: true
  autoRefresh: true
os:
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
confirmOnQuit: false
