# Theme
theme = catppuccin-mocha

# General
auto-update = off

# Keybindings: Free Ctrl/Ctrl+Shift for tmux
keybind = ctrl+shift+left=unbind
keybind = ctrl+shift+right=unbind
keybind = ctrl+shift+n=unbind
keybind = ctrl+shift+r=unbind
keybind = ctrl+shift+w=unbind
keybind = ctrl+n=unbind
keybind = ctrl+r=unbind

# Shift+Enter sends newline
keybind = shift+enter=text:\x0a
