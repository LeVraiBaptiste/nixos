# Rebind prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General settings
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g mouse on
set -g escape-time 0
set -g set-clipboard on
set -g allow-passthrough on

# Status bar on top
set -g status-position top

# Vi mode for copy
setw -g mode-keys vi
bind x copy-mode
bind -T copy-mode-vi c send -X begin-selection
bind -T copy-mode-vi v send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'

# Intuitive splits (open in current path)
bind - split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind -n C-n new-window -c "#{pane_current_path}"

# Ctrl+Shift+N to create new session
bind -n C-S-n command-prompt -p "New session name:" "new-session -s '%%'"

# Close current pane (closes window if last pane)
bind -n C-w kill-pane

# Close current window
bind -n C-S-w kill-window

# Rename current window
bind -n C-r command-prompt -I "#W" "rename-window '%%'"

# Rename current session
bind -n C-S-r command-prompt -I "#S" "rename-session '%%'"

# Pane navigation with Shift+arrows
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Ctrl+Shift arrow to switch windows
bind -n C-S-Left previous-window
bind -n C-S-Right next-window

# Ctrl+Shift Up/Down to switch sessions
bind -n C-S-Up switch-client -p
bind -n C-S-Down switch-client -n

# Pane borders (Hyprland-style)
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g window-style 'bg=#141414'
set -g window-active-style 'bg=#242424'
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status bar
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right " #{pane_current_path}"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'
# Resurrect: save/restore pane contents and processes
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
