# vulnix false positives, see https://github.com/nix-community/vulnix#whitelisting
# A package name or name-version, with the CVEs to ignore (all of them if `cve` is omitted):
#
# ["Diff-1.0.2"]
# cve = ["CVE-2024-13278"]
# comment = "Haskell library, the CVE is about the Drupal Diff module"

# Name collisions: the CVEs are about a different project with the same name.
# Keyed by name only so they stay silenced across upgrades; new CVEs still show.

["git"]
cve = ["CVE-2022-36882", "CVE-2022-30947", "CVE-2022-36883", "CVE-2022-38663", "CVE-2021-21684", "CVE-2022-36884"]
comment = "Jenkins Git plugin, not git"

["kitty"]
cve = ["CVE-2024-23749", "CVE-2024-25003", "CVE-2024-25004", "CVE-2023-48795"]
comment = "KiTTY (Windows PuTTY fork), not the kitty terminal"

["shellcheck"]
cve = ["CVE-2021-28794"]
comment = "vscode-shellcheck extension, not shellcheck"

["bolt"]
cve = ["CVE-2022-31321", "CVE-2025-34086", "CVE-2021-27367", "CVE-2023-5214"]
comment = "Bolt CMS, not the Thunderbolt daemon"

["snappy"]
cve = ["CVE-2023-28115", "CVE-2023-41330"]
comment = "KnpLabs Snappy (PHP), not Google snappy"

["orc"]
cve = ["CVE-2025-47436"]
comment = "Apache ORC, not the GStreamer Oil Runtime Compiler"

["go"]
cve = ["CVE-2023-49292"]
comment = "ecies/go library, not the Go toolchain"

["avahi"]
cve = ["CVE-2021-26720"]
comment = "Debian-only avahi-daemon-check-dns.sh script, not shipped by nixpkgs"

["zlib"]
cve = ["CVE-2026-27820"]
comment = "Ruby zlib gem (Zlib::GzipReader), not the zlib C library"

["terraform"]
cve = ["CVE-2021-36230"]
comment = "Terraform Enterprise (the hosted server), not the terraform CLI"

# Version misread: vulnix sees version "1"/"3", the CVEs were fixed long before ours.

["dbus"]
cve = ["CVE-2022-42010", "CVE-2022-42011", "CVE-2022-42012"]
comment = "Fixed in dbus 1.14.4"

["lapack"]
cve = ["CVE-2021-4048"]
comment = "Fixed in LAPACK 3.10.1"

["cups"]
cve = ["CVE-2022-26691"]
comment = "Fixed in CUPS 2.4.2"

# NVD ranges wider than the advisory: the text says these versions are fixed.

["brotli"]
cve = ["CVE-2026-111497"]
comment = "Affects 1.0.3 to 1.2.0, fixed in 1.2.1"

["perl"]
cve = ["CVE-2026-8376", "CVE-2026-13221"]
comment = "Fixed in 5.40.5 and 5.42.3, the CPE covers everything below 5.43.10"

["ffmpeg"]
cve = ["CVE-2025-25469"]
comment = "git-master before 2025-01-13, fixed before the 8.0 release"

# Not reachable here

["cjson"]
cve = ["CVE-2026-16554"]
comment = "32-bit platforms only, every host is x86_64"

["gcc"]
cve = ["CVE-2023-4039"]
comment = "aarch64 -fstack-protector only, every host is x86_64"
